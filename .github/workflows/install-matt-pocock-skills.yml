name: Install Matt Pocock Skills

on:
  push:
    branches:
      - codex/issue-1-lead-engine
    paths:
      - .github/workflows/install-matt-pocock-skills.yml

permissions:
  contents: write

jobs:
  install-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: codex/issue-1-lead-engine
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Matt Pocock stable skills for Codex
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          npx skills@latest add mattpocock/skills \
            --skill ask-matt \
            --skill grill-with-docs \
            --skill triage \
            --skill improve-codebase-architecture \
            --skill setup-matt-pocock-skills \
            --skill to-spec \
            --skill to-tickets \
            --skill implement \
            --skill wayfinder \
            --skill prototype \
            --skill diagnosing-bugs \
            --skill research \
            --skill tdd \
            --skill domain-modeling \
            --skill codebase-design \
            --skill code-review \
            --skill resolving-merge-conflicts \
            --skill wizard \
            --skill grill-me \
            --skill handoff \
            --skill teach \
            --skill to-questionnaire \
            --skill wait-what \
            --skill grilling \
            --skill writing-for-agents \
            --agent codex \
            --copy \
            --yes

      - name: Commit installed skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills
          if git diff --cached --quiet; then
            echo "No skill changes to commit."
            exit 0
          fi
          git commit -m "chore: install Matt Pocock real-engineer skills"
          git push origin HEAD:codex/issue-1-lead-engine
